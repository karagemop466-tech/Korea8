[project]
name = "korea8-gems"
version = "0.1.0"
description = "Auditable DOE GEMS fault-prediction research pipeline (Korea8)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "rasterio>=1.3",
  "scikit-learn>=1.4",
  "tifffile>=2024.1.30",
  "pyproj>=3.6",
  "shapely>=2.0",
  "requests>=2.31",
  "affine>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "vendor"]

[tool.ruff]
line-length = 110
target-version = "py311"
