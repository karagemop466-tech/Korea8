name: Publish overflow dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build canonical dashboard
        run: python scripts/build_overflow_site.py
      - name: Verify canonical dashboard
        run: python scripts/verify_overflow_site.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_overflow*.py' -v
      - name: Stage linked public files only
        run: python scripts/stage_overflow_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/pages'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm deployed dashboard and audit over HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          expected = {
              'index.html': 'Trip Lever Project',
              'verification.html': 'audit/2026-11-10-87e121e1/REPORT.md',
              'flagged-for-review.html': '10 November publication review',
              'audit/2026-11-10-660ab2dd.md': 'Configuration permission limitation',
              'audit/2026-11-10-87e121e1/REPORT.md': '2026-11-10',
          }
          for path, marker in expected.items():
              for attempt in range(12):
                  try:
                      url = base + path + '?deployment=' + os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url, timeout=30) as response:
                          text = response.read().decode('utf-8')
                          assert marker in text, 'Expected content not yet served'
                          print(f'LIVE VERIFIED {response.status}: {base}{path}')
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
          PY
