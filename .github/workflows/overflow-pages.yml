name: Publish overflow dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build canonical dashboard
        run: python scripts/build_overflow_site.py
      - name: Verify canonical dashboard
        run: python scripts/verify_overflow_site.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_overflow*.py' -v
      - name: Stage linked public files only
        run: python scripts/stage_overflow_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/pages'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
