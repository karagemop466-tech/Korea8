name: Verify overflow official sources

on:
  workflow_dispatch:
  push:
    branches: [arena/fb376384-korea8]
    paths:
      - 'scripts/verify_external_sources.py'
      - '.github/workflows/fb-source-check.yml'
      - 'overflow-integration/data/*.json'

permissions:
  contents: read

concurrency:
  group: fb-overflow-source-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF text tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Recheck official sources and CSLB provider records
        run: python scripts/verify_external_sources.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-overflow-source-report
          path: audit/fb376384-2026-11-08/external-source-check.json
          if-no-files-found: warn
