name: GEMS Korea8 pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gems-korea8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore public competition mirrors (hash-verified)
        run: python scripts/download_competition_data.py

      - name: Validate grid and cache feature stack
        run: python scripts/prepare_data.py

      - name: Run canary + holdout + production + uniqueness + format gate
        run: python scripts/run_experiment.py

      - name: Build evidence site
        run: python scripts/build_site.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Commit small outputs back to branch
        if: always()
        run: |
          git config user.name "korea8-agent"
          git config user.email "agent@korea8.local"
          git add evidence docs registry/focus9 registry/lattice_s5.tif || true
          if git diff --cached --quiet; then
            echo "no small outputs to commit"
          else
            git commit -m "korea8: pipeline evidence + candidate raster [skip ci]"
            git push origin HEAD:arena/d7026453-korea8
          fi

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea8-evidence
          path: |
            evidence/**
            docs/**
          if-no-files-found: warn
